<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sushi Picker</title>
<style>
:root{--bg:#fbfaf8;--card:#fff;--ink:#18181b;--mute:#71717a;--line:#e7e5e4;--accent:#e4572e;--accent-d:#c9431f;--tint:#fff4ef;--ok:#2e7d5b;--r:12px}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
header{display:flex;justify-content:space-between;align-items:center;max-width:600px;margin:0 auto;padding:24px 20px}
.logo{font-weight:700;letter-spacing:-.01em}
.link{background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;font-size:.9rem;padding:6px 0}
.link:hover{color:var(--ink)}
main{max-width:600px;margin:0 auto;padding:24px 20px 80px;transition:max-width .2s}
h1{font-size:1.75rem;line-height:1.2;margin:0 0 6px;letter-spacing:-.025em}
p.sub{color:var(--mute);margin:0 0 36px}
.field{margin-bottom:28px}
.lbl{display:block;font-size:.85rem;font-weight:600;margin-bottom:8px}
input[type=text],input[type=number],input[type=password],.datebtn{width:100%;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r);font:inherit;color:inherit;background:var(--card);transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#a1a1aa}
input:focus,.datebtn:focus-visible,.datebtn.open{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(228,87,46,.15)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:12px;height:60px;padding:0 10px 0 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;transition:.15s}
.opt:hover{border-color:#d6d3d1}
.opt.on{border-color:var(--accent);background:var(--tint);box-shadow:0 0 0 1px var(--accent)}
.opt i{font-style:normal;font-size:1.25rem}
.opt .info{flex:1;line-height:1.25;min-width:0}
.opt .info b{display:block;font-size:.95rem;font-weight:500}
.opt .info small{color:var(--mute);font-size:.82rem}
.step{display:flex;align-items:center;gap:2px}
.step button{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:var(--card);font:inherit;font-size:1.05rem;line-height:1;color:var(--ink);cursor:pointer}
.step button:hover{border-color:#a8a29e}
.step button:focus-visible{outline:0;box-shadow:0 0 0 3px rgba(228,87,46,.25)}
.step span{min-width:24px;text-align:center;font-weight:600;font-size:.95rem}
.cart{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 16px;margin-bottom:20px}
.cart div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:.93rem}
.cart div+div{border-top:1px solid var(--line)}
.cart .q{color:var(--mute);margin-right:6px}
.cart .tot{font-weight:700;font-size:1rem}
.note{color:var(--mute);font-size:.85rem;text-align:center;margin:12px 0 0}
.pay{border:1px solid var(--line);border-radius:999px;background:var(--card);padding:5px 12px 5px 10px;font:inherit;font-size:.82rem;font-weight:600;color:#b45309;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.pay::before{content:"";width:8px;height:8px;border-radius:50%;background:#f59e0b}
.pay:hover{border-color:#a8a29e}
.pay.paid{color:var(--ok);background:#eefaf4;border-color:#cdebdc}
.pay.paid::before{background:var(--ok)}
td.items{white-space:normal;min-width:170px}
.past{margin-top:56px}
.past h2{font-size:.85rem;font-weight:600;margin:0 0 8px}
.po{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;font-size:.93rem}
.po .top{display:flex;justify-content:space-between;gap:12px;font-weight:600}
.po .it{color:var(--mute);margin:4px 0 8px}
.po .bot{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--mute);font-size:.82rem}
.tag{font-weight:600;color:#b45309}.tag.paid{color:var(--ok)}
.datewrap{position:relative}
.datebtn{display:flex;align-items:center;justify-content:space-between;cursor:pointer;text-align:left}
.datebtn.empty #dateText{color:#a1a1aa}
.datebtn svg{color:var(--mute);flex:none}
.cal{position:absolute;z-index:10;bottom:56px;left:0;width:308px;max-width:100%;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px rgba(24,24,27,.12);animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}
.shade{display:none}
@media (max-width:640px){
  .cal{position:fixed;top:50%;bottom:auto;left:50%;width:min(340px,calc(100vw - 32px));max-width:none;transform:translate(-50%,-50%);box-shadow:0 20px 48px rgba(24,24,27,.22);animation-name:popmid}
  .shade{display:block;position:fixed;inset:0;z-index:9;background:rgba(24,24,27,.28);animation:fade .14s ease-out}
}
@keyframes popmid{from{opacity:0;transform:translate(-50%,-48%)}}
@keyframes fade{from{opacity:0}}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead b{font-size:.95rem}
.nav{width:32px;height:32px;border:0;border-radius:8px;background:none;cursor:pointer;font-size:1.1rem;color:var(--ink)}
.nav:hover:not(:disabled){background:#f4f4f5}
.nav:disabled{opacity:.25;cursor:default}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.days small{text-align:center;font-size:.72rem;color:var(--mute);padding:6px 0}
.day{aspect-ratio:1;border:0;border-radius:50%;background:none;font:inherit;font-size:.9rem;color:inherit;cursor:pointer}
.day:hover:not(:disabled){background:#f4f4f5}
.day:disabled{color:#d4d4d8;cursor:default}
.day.today{box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
.day.sel,.day.sel:hover{background:var(--accent);color:#fff;box-shadow:none}
.btn{width:100%;height:50px;border:0;border-radius:var(--r);background:var(--ink);color:#fff;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:#000}
.msg{margin-top:14px;font-size:.9rem;min-height:1.4em;text-align:center}
.err{color:#c0392b}.ok{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.card .field:last-of-type{margin-bottom:24px}
.hide{display:none}
main.wide{max-width:900px}
.tw{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600}
tr:last-child td{border-bottom:0}
td.t{color:var(--mute)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.85rem}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.none{text-align:center;color:var(--mute);padding:48px 20px}
.sec{font-size:1.1rem;margin:44px 0 4px;letter-spacing:-.01em}
.sec+p{color:var(--mute);font-size:.9rem;margin:0 0 14px}
.menued{padding:10px 16px}
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow input{height:42px}
.mrow .em{width:58px;flex:none;text-align:center;padding:0 6px;font-size:1.15rem}
.mrow .nm{flex:1 1 150px;width:auto;min-width:0}
.mrow .pr{width:92px;flex:none}
.sm{height:42px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font:inherit;font-size:.88rem;font-weight:600;color:var(--ink);cursor:pointer;transition:.15s}
.sm:hover{border-color:#a8a29e}
.sm.go{background:var(--ink);border-color:var(--ink);color:#fff}
.sm.del{color:#c0392b}
.sm:disabled{opacity:.5;cursor:default}
@media (max-width:640px){
  header{padding:16px 16px 8px}
  main{padding:16px 16px 64px}
  #admin .bar{margin-bottom:16px}
  #admin .bar h1{font-size:1.4rem}
  #admin .link{padding:10px 0}
  .stats{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 16px;padding:0 16px 4px;scrollbar-width:none}
  .stats::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .tw{overflow:visible}
  .tw table,.tw tbody{display:block}
  .tw thead{display:none}
  .tw tr{display:grid;grid-template-columns:1fr auto;grid-template-areas:"who tot" "items items" "want cash" "t cash";gap:2px 12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
  .tw tr:last-child{border-bottom:0}
  .tw td{padding:0;border:0;white-space:normal;min-width:0}
  td.who{grid-area:who;font-weight:600;font-size:1rem;overflow-wrap:anywhere}
  td.tot{grid-area:tot;font-size:1rem;text-align:right}
  td.items{grid-area:items;color:var(--mute);margin:2px 0 8px}
  td.want{grid-area:want;font-size:.88rem}
  td.want::before{content:"For "}
  td.t{grid-area:t;font-size:.8rem}
  td.t::before{content:"Ordered "}
  td.cash{grid-area:cash;justify-self:end}
  .pay{padding:10px 16px 10px 13px;font-size:.88rem}
  .sec{margin-top:32px}
  .menued{padding:6px 14px}
  .mrow{padding:12px 0}
  .mrow input,.sm{height:46px}
  .mrow .em{width:52px}
  .mrow .nm{flex:1 1 calc(100% - 152px)}
  .mrow .pr{width:84px}
  .mrow .sm{flex:1}
}
</style>
</head>
<body>
<header>
  <div class="logo">🍣 Sushi Picker</div>
  <button class="link" id="navAdmin">Staff login</button>
</header>
<main>

<section id="pick">
  <h1>What are you craving?</h1>
  <p class="sub">Add what you like, pick a day, pay in cash.</p>
  <form id="pickForm" novalidate>
    <div class="field">
      <label class="lbl" for="name">Your name</label>
      <input type="text" id="name" maxlength="40" autocomplete="name" placeholder="Alex">
    </div>
    <div class="field">
      <span class="lbl" id="lbl">Sushi</span>
      <div class="grid" id="grid" role="group" aria-labelledby="lbl"></div>
    </div>
    <div class="field">
      <span class="lbl" id="dlbl">Day you want it</span>
      <div class="datewrap">
        <button type="button" class="datebtn empty" id="dateBtn" aria-haspopup="dialog" aria-expanded="false" aria-labelledby="dlbl dateText">
          <span id="dateText">Pick a date</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        </button>
        <div class="shade hide" id="shade"></div>
        <div class="cal hide" id="cal" role="dialog" aria-label="Choose a date">
          <div class="calhead">
            <button type="button" class="nav" id="prev" aria-label="Previous month">‹</button>
            <b id="calTitle" aria-live="polite"></b>
            <button type="button" class="nav" id="next" aria-label="Next month">›</button>
          </div>
          <div class="days" id="days"></div>
        </div>
      </div>
    </div>
    <div class="cart hide" id="cart" aria-live="polite"></div>
    <button class="btn" type="submit" id="submit">Submit</button>
    <p class="note">No payment here. Pay in cash.</p>
    <div class="msg" id="pickMsg" role="status"></div>
  </form>
  <div class="past hide" id="past"><h2>Your past orders</h2><div id="pastList"></div></div>
</section>

<section id="login" class="hide">
  <h1>Staff login</h1>
  <p class="sub">See who asked for what.</p>
  <form id="loginForm" class="card">
    <div class="field">
      <label class="lbl" for="user">Username</label>
      <input type="text" id="user" autocomplete="username" required>
    </div>
    <div class="field">
      <label class="lbl" for="pw">Password</label>
      <input type="password" id="pw" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit">Log in</button>
    <div class="msg err" id="loginMsg" role="alert"></div>
  </form>
</section>

<section id="admin" class="hide">
  <div class="bar"><h1 style="margin:0" id="hello"></h1><span><button class="link" id="refresh" style="margin-right:16px">Refresh</button><button class="link" id="logout">Log out</button></span></div>
  <div class="stats" id="stats"></div>
  <div id="tableWrap"></div>
  <button class="link" id="clear" style="margin-top:16px">Clear all submissions</button>
  <h2 class="sec">Menu</h2>
  <p>Change the emoji, name or price and press Save. Customers see changes right away.</p>
  <div class="card menued" id="menuEd"></div>
  <div class="msg" id="menuMsg" role="status"></div>
</section>

</main>
<script>
// Starter menu, shown until the live one loads from the database
let MENU=[["Salmon Nigiri","🍣",5],["Tuna Roll","🍙",6],["California Roll","🥑",6],["Shrimp Tempura","🍤",8],["Eel Roll","🐟",9],["Veggie Roll","🥒",5]].map(([name,emoji,price],i)=>({id:"d"+i,name,emoji,price}));
// Supabase project (the publishable key is meant to be public; the database rules do the protecting)
const SB_URL="https://ielxhqawejlkavlqccsa.supabase.co", SB_KEY="sb_publishable_ahBumScCxZyok2TrV-0RQA_XC0yiaPn";
const MINE="sushi_my_orders", SESSION="sushi_session";
async function sb(path,body){
  const h={apikey:SB_KEY,"Content-Type":"application/json"};if(!path.startsWith("rpc/"))h.Prefer="return=minimal";
  const r=await fetch(SB_URL+"/rest/v1/"+path,{method:"POST",headers:h,body:JSON.stringify(body)});
  if(!r.ok){const e=new Error("request failed");e.status=r.status;try{e.code=(await r.json()).code;}catch{}throw e;}
  const t=await r.text();return t?JSON.parse(t):null;
}
const rpc=(fn,args)=>sb("rpc/"+fn,args);
const sess=()=>{try{const s=JSON.parse(sessionStorage.getItem(SESSION));return s&&s.p?s:null;}catch{return null;}};
const cred=()=>{const s=sess();return {u:s.u,p:s.p};};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const money=n=>"$"+n.toFixed(2);

/* ---- menu + cart ---- */
const qty={}, q=id=>qty[id]||0;
const cartItems=()=>MENU.map(x=>({name:x.name,price:x.price,qty:q(x.id)})).filter(x=>x.qty);
const sum=items=>items.reduce((t,x)=>t+x.price*x.qty,0);
function drawMenu(){
  $("grid").innerHTML=MENU.map(x=>{const n=esc(x.name),c=q(x.id);return `<div class="opt${c?" on":""}" data-id="${x.id}"><i>${esc(x.emoji)}</i><div class="info"><b>${n}</b><small>${money(x.price)}</small></div><div class="step">${c?`<button type="button" data-d="-1" aria-label="Remove one ${n}">−</button><span aria-label="${c} in cart">${c}</span>`:""}<button type="button" data-d="1" aria-label="Add ${n}">+</button></div></div>`;}).join("")||`<div class="none">Nothing on the menu yet.</div>`;
  const items=cartItems(),t=sum(items);
  $("cart").classList.toggle("hide",!items.length);
  $("cart").innerHTML=items.map(x=>`<div><span><span class="q">${x.qty} ×</span>${esc(x.name)}</span><span>${money(x.price*x.qty)}</span></div>`).join("")+`<div class="tot"><span>Total</span><span>${money(t)}</span></div>`;
  $("submit").textContent=items.length?`Submit · ${money(t)}`:"Submit";
}
$("grid").onclick=e=>{const c=e.target.closest(".opt");if(!c)return;const id=c.dataset.id,b=e.target.closest("button"),d=b?+b.dataset.d:(q(id)?0:1);
  if(!d)return;qty[id]=Math.max(0,Math.min(20,q(id)+d));drawMenu();$("pickMsg").textContent="";
  if(b){const c2=$("grid").querySelector(`.opt[data-id="${id}"]`);(c2.querySelector(`[data-d="${d}"]`)||c2.querySelector("button")).focus();}};
drawMenu();
async function loadMenu(){
  try{const r=await fetch(SB_URL+"/rest/v1/menu?select=id,name,emoji,price&order=pos,created_at",{headers:{apikey:SB_KEY}});if(!r.ok)return false;
    MENU=(await r.json()).map(x=>({...x,price:+x.price}));drawMenu();return true;}catch{return false;}
}
loadMenu();

/* ---- calendar ---- */
const now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
let view=new Date(today.getFullYear(),today.getMonth(),1), picked=null;
const pad=n=>String(n).padStart(2,"0");
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d);};
const nice=d=>d.toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"});
function drawCal(){
  $("calTitle").textContent=view.toLocaleDateString([],{month:"long",year:"numeric"});
  $("prev").disabled=view<=new Date(today.getFullYear(),today.getMonth(),1);
  const y=view.getFullYear(),m=view.getMonth(),n=new Date(y,m+1,0).getDate();
  let h=["S","M","T","W","T","F","S"].map(d=>`<small>${d}</small>`).join("")+"<span></span>".repeat(view.getDay());
  for(let d=1;d<=n;d++){const dt=new Date(y,m,d),k=key(dt);
    h+=`<button type="button" class="day${+dt===+today?" today":""}${k===picked?" sel":""}" data-k="${k}" aria-label="${nice(dt)}" ${dt<today?"disabled":""}>${d}</button>`;}
  $("days").innerHTML=h;
}
function setCal(open){$("cal").classList.toggle("hide",!open);$("shade").classList.toggle("hide",!open);$("dateBtn").classList.toggle("open",open);$("dateBtn").setAttribute("aria-expanded",open);if(open)drawCal();}
function setDate(k){picked=k;$("dateText").textContent=k?nice(fromKey(k)):"Pick a date";$("dateBtn").classList.toggle("empty",!k);}
$("dateBtn").onclick=()=>setCal($("cal").classList.contains("hide"));
$("prev").onclick=()=>{view.setMonth(view.getMonth()-1);drawCal();};
$("next").onclick=()=>{view.setMonth(view.getMonth()+1);drawCal();};
$("days").onclick=e=>{const b=e.target.closest(".day");if(!b)return;setDate(b.dataset.k);setCal(false);$("dateBtn").focus();$("pickMsg").textContent="";};
$("shade").onclick=()=>setCal(false);
document.addEventListener("click",e=>{if(!e.target.closest(".datewrap"))setCal(false);});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("cal").classList.contains("hide")){setCal(false);$("dateBtn").focus();}});

/* ---- views ---- */
const cur=()=>["pick","login","admin"].find(s=>!$(s).classList.contains("hide"));
function show(id){["pick","login","admin"].forEach(s=>$(s).classList.toggle("hide",s!==id));
  document.querySelector("main").classList.toggle("wide",id==="admin");if(id==="pick")drawPast();
  $("navAdmin").textContent=id!=="pick"?"Order form":(sess()?"Dashboard":"Staff login");}
$("navAdmin").onclick=()=>{if(cur()!=="pick")return show("pick");
  if(sess()){show("admin");render();drawMenuEd();}else show("login");};

$("pickForm").onsubmit=async e=>{e.preventDefault();
  const name=$("name").value.trim(),items=cartItems(),m=$("pickMsg"),btn=$("submit");
  const miss=!name?"Please add your name.":!items.length?"Please add at least one sushi.":!picked?"Please pick a day.":"";
  if(miss){m.className="msg err";m.textContent=miss;if(!name)$("name").focus();else if(!items.length)($("grid").querySelector("button")||$("name")).focus();else $("dateBtn").focus();return;}
  const total=sum(items),order={id:crypto.randomUUID(),name,items,total,day:picked};
  btn.disabled=true;btn.textContent="Sending…";m.textContent="";
  try{await sb("orders",order);}
  catch{m.className="msg err";m.textContent="Couldn't send your order. Check your connection and try again.";btn.disabled=false;drawMenu();return;}
  btn.disabled=false;
  const mine=myOrders();mine.push({...order,at:new Date().toISOString()});localStorage.setItem(MINE,JSON.stringify(mine));
  m.className="msg ok";m.textContent=`Thanks ${name}! Your order for ${nice(fromKey(picked))} is in. Bring ${money(total)} in cash.`;
  e.target.reset();for(const k in qty)delete qty[k];drawMenu();setDate(null);drawPast();};

/* ---- this browser's past orders ---- */
function myOrders(){return JSON.parse(localStorage.getItem(MINE)||"[]");}
async function drawPast(){
  const mine=myOrders().filter(x=>x.items&&x.day).reverse();
  $("past").classList.toggle("hide",!mine.length);
  const paint=st=>$("pastList").innerHTML=mine.map(x=>{const live=st&&x.id in st,paid=live&&st[x.id];
    return `<div class="po"><div class="top"><span>${nice(fromKey(x.day))}</span><span>${money(x.total)}</span></div><div class="it">${x.items.map(it=>`${it.qty} × ${esc(it.name)}`).join(", ")}</div><div class="bot"><span>Ordered ${new Date(x.at).toLocaleString([],{dateStyle:"medium",timeStyle:"short"})} as ${esc(x.name)}</span>${live?`<span class="tag${paid?" paid":""}">${paid?"Paid":"Not paid"}</span>`:""}</div></div>`;}).join("");
  paint(null);if(!mine.length)return;
  const ids=mine.map(x=>x.id).filter(id=>/^[0-9a-f-]{36}$/.test(id));if(!ids.length)return;
  try{const rows=await rpc("order_status",{ids});paint(Object.fromEntries(rows.map(r=>[r.id,r.paid])));}catch{}
}
drawPast();

$("loginForm").onsubmit=async e=>{e.preventDefault();
  const u=$("user").value.trim(),p=$("pw").value,m=$("loginMsg"),btn=e.target.querySelector(".btn");
  btn.disabled=true;m.textContent="";
  try{const name=await rpc("staff_login",{u,p});sessionStorage.setItem(SESSION,JSON.stringify({u,p,name}));e.target.reset();show("admin");drawMenuEd();await render();}
  catch(err){m.textContent=err.code==="28000"?"Wrong username or password.":"Couldn't reach the server. Try again.";}
  btn.disabled=false;};

$("logout").onclick=()=>{sessionStorage.removeItem(SESSION);show("pick");};
$("clear").onclick=async()=>{if(!confirm("Delete all submissions for everyone? This can't be undone."))return;
  try{await rpc("staff_clear",cred());}catch{alert("Couldn't clear. Try again.");}render();};
$("refresh").onclick=()=>{render();drawMenuEd();};

/* ---- staff menu editor ---- */
const mrow=x=>`<form class="mrow" data-id="${x?x.id:""}" novalidate><input type="text" class="em" name="e" maxlength="16" value="${x?esc(x.emoji):""}" placeholder="🍣" aria-label="Emoji"><input type="text" class="nm" name="n" maxlength="40" value="${x?esc(x.name):""}" placeholder="${x?"Name":"New item name"}" aria-label="Name"><input type="number" class="pr" name="p" min="0" max="999" step="0.01" inputmode="decimal" value="${x?x.price.toFixed(2):""}" placeholder="0.00" aria-label="Price in dollars">${x?`<button class="sm" type="submit">Save</button><button class="sm del" type="button" data-del>Delete</button>`:`<button class="sm go" type="submit">Add</button>`}</form>`;
async function drawMenuEd(){
  const ok=await loadMenu();
  $("menuEd").innerHTML=ok?MENU.map(mrow).join("")+mrow(null):`<div class="none">Couldn't load the menu. Press Refresh.</div>`;
}
const menuMsg=(t,bad)=>{$("menuMsg").className="msg "+(bad?"err":"ok");$("menuMsg").textContent=t;};
$("menuEd").addEventListener("submit",async e=>{e.preventDefault();
  const f=e.target,el=f.elements,id=f.dataset.id||null,name=el.n.value.trim(),emoji=el.e.value.trim()||"🍣",price=parseFloat(el.p.value);
  if(!name){menuMsg("Give it a name.",1);el.n.focus();return;}
  if(!(price>=0&&price<1000)){menuMsg("Give it a price between 0 and 999.",1);el.p.focus();return;}
  f.querySelectorAll("button").forEach(b=>b.disabled=true);
  try{await rpc("staff_menu_save",{...cred(),item_id:id,item_name:name,item_emoji:emoji,item_price:Math.round(price*100)/100});menuMsg(id?`Saved ${name}.`:`Added ${name}.`);}
  catch{menuMsg("Couldn't save. Try again.",1);}
  await drawMenuEd();});
$("menuEd").addEventListener("click",async e=>{const b=e.target.closest("[data-del]");if(!b)return;
  const f=b.closest(".mrow"),name=f.elements.n.value.trim()||"this item";
  if(!confirm(`Remove ${name} from the menu?`))return;
  b.disabled=true;
  try{await rpc("staff_menu_delete",{...cred(),item_id:f.dataset.id});menuMsg(`Removed ${name}.`);}
  catch{menuMsg("Couldn't remove. Try again.",1);}
  await drawMenuEd();});

$("tableWrap").onclick=async e=>{const b=e.target.closest(".pay");if(!b)return;const id=b.dataset.id,to=b.getAttribute("aria-pressed")!=="true";
  b.disabled=true;
  try{await rpc("staff_set_paid",{...cred(),order_id:id,is_paid:to});}catch{alert("Couldn't update. Try again.");}
  await render();const n=document.querySelector(`.pay[data-id="${id}"]`);if(n)n.focus();};
async function render(){
  const s=sess();if(!s)return show("login");
  $("hello").textContent=`Hi, ${s.name}`;
  let o;
  try{o=await rpc("staff_orders",cred());}
  catch(err){if(err.code==="28000"){sessionStorage.removeItem(SESSION);return show("login");}
    $("stats").innerHTML="";$("tableWrap").innerHTML=`<div class="none card">Couldn't load orders. Check your connection and press Refresh.</div>`;return;}
  const counts={};let owed=0,got=0;
  o.forEach(x=>{x.items.forEach(it=>counts[it.name]=(counts[it.name]||0)+it.qty);x.paid?got+=+x.total:owed+=+x.total;});
  $("stats").innerHTML=`<span class="chip"><b>${o.length}</b> orders</span><span class="chip">Not paid <b>${money(owed)}</b></span><span class="chip">Paid <b>${money(got)}</b></span>`+Object.entries(counts).map(([k,v])=>`<span class="chip">${esc(k)} <b>${v}</b></span>`).join("");
  $("tableWrap").innerHTML=o.length?`<div class="tw"><table><thead><tr><th>Name</th><th>Order</th><th>Total</th><th>Wanted for</th><th>Submitted</th><th>Cash</th></tr></thead><tbody>${o.map(x=>`<tr><td class="who">${esc(x.name)}</td><td class="items">${x.items.map(it=>`${+it.qty} × ${esc(String(it.name))}`).join("<br>")}</td><td class="tot"><b>${money(+x.total)}</b></td><td class="want">${nice(fromKey(x.day))}</td><td class="t">${new Date(x.created_at).toLocaleString([],{dateStyle:"medium",timeStyle:"short"})}</td><td class="cash"><button type="button" class="pay${x.paid?" paid":""}" data-id="${x.id}" aria-pressed="${!!x.paid}" title="Click to change">${x.paid?"Paid":"Not paid"}</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="none card">No submissions yet.</div>`;
}
</script>
</body>
</html>
